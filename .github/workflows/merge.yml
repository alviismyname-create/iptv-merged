name: Merge IPTV Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Merge Playlists
        run: |
          # Start the playlist with the required header
          echo "#EXTM3U" > output.m3u

          # ===================================================
          # 1. MALAYALAM CHANNELS (All forced to "Malayalam" group)
          # ===================================================
          echo "# ========== MALAYALAM CHANNELS ==========" >> output.m3u
          wget -q -O mal.m3u "https://iptv-org.github.io/iptv/languages/mal.m3u"
          # Override EVERY group-title to just "Malayalam"
          sed -i 's/group-title="[^"]*"/group-title="Malayalam"/g' mal.m3u
          # Remove the header line (#EXTM3U) and append the rest
          grep -v -i "^#EXTM3U" mal.m3u >> output.m3u

          # ===================================================
          # 2. TAMIL CHANNELS (All forced to "Tamil" group)
          # ===================================================
          echo "# ========== TAMIL CHANNELS ==========" >> output.m3u
          wget -q -O tam.m3u "https://iptv-org.github.io/iptv/languages/tam.m3u"
          # Override EVERY group-title to just "Tamil"
          sed -i 's/group-title="[^"]*"/group-title="Tamil"/g' tam.m3u
          # Remove the header line (#EXTM3U) and append the rest
          grep -v -i "^#EXTM3U" tam.m3u >> output.m3u

          # ===================================================
          # 3. ENGLISH & OTHER CHANNELS (Keep their original groups)
          # ===================================================
          echo "# ========== ENGLISH & OTHER CHANNELS ==========" >> output.m3u
          wget -q -O eng1.m3u "https://raw.githubusercontent.com/wizakorhd/iptv/main/playlist.m3u"
          grep -v -i "^#EXTM3U" eng1.m3u >> output.m3u

          wget -q -O eng2.m3u "https://raw.githubusercontent.com/doms9/iptv/refs/heads/default/M3U8/base.m3u8"
          grep -v -i "^#EXTM3U" eng2.m3u >> output.m3u

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
