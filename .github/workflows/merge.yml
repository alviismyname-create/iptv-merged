name: Merge IPTV Playlists

on:
  schedule:
    - cron: '0 */6 * * *'   # Runs automatically every 6 hours
  workflow_dispatch:         # Allows you to manually run it anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Merge Playlists
        run: |
          # Initialize the M3U file with the standard header
          echo "#EXTM3U" > merged.m3u

          # ------------------------------------------------------------
          # 1. MALAYALAM - Force ALL channels into "Malayalam" group
          # ------------------------------------------------------------
          echo "Downloading Malayalam (mal.m3u)..."
          wget -q -O temp.m3u "https://iptv-org.github.io/iptv/languages/mal.m3u"
          grep -v -i "^#EXTM3U" temp.m3u | sed -E 's/ group-title="[^"]*"//g; s/^#EXTINF:/#EXTINF: group-title="Malayalam" /' >> merged.m3u

          # ------------------------------------------------------------
          # 2. TAMIL - Force ALL channels into "Tamil" group
          # ------------------------------------------------------------
          echo "Downloading Tamil (tam.m3u)..."
          wget -q -O temp.m3u "https://iptv-org.github.io/iptv/languages/tam.m3u"
          grep -v -i "^#EXTM3U" temp.m3u | sed -E 's/ group-title="[^"]*"//g; s/^#EXTINF:/#EXTINF: group-title="Tamil" /' >> merged.m3u

          # ------------------------------------------------------------
          # 3. OTHER 3 SOURCES - Download them WITHOUT any changes
          # ------------------------------------------------------------
          urls=(
            "https://raw.githubusercontent.com/wizakorhd/iptv/main/playlist.m3u"
            "https://raw.githubusercontent.com/doms9/iptv/refs/heads/default/M3U8/base.m3u8"
            "https://CeresLabX.github.io/us-tv/playlist.m3u"
          )

          for url in "${urls[@]}"; do
            echo "Downloading: $url"
            wget -q -O temp.m3u "$url"
            # Append WITHOUT modifying anything (keep their original group-titles)
            grep -v -i "^#EXTM3U" temp.m3u >> merged.m3u
          done

          echo "✅ Raw merge complete. Total lines: $(wc -l < merged.m3u)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Reorder Playlist (Malayalam 1st, Tamil 2nd)
        run: |
          # Create the Python script directly inside the workflow
          cat > reorder.py << 'EOF'
          import re
          import sys
          from collections import OrderedDict

          INPUT_FILE = "merged.m3u"
          OUTPUT_FILE = "output.m3u"

          # Optional: Filter out adult channels (remove these keywords if you don't want filtering)
          FILTER_KEYWORDS = ["xxx", "adult", "18+", "porn", "sex", "fuck", "hardcore"]

          def is_filtered(name):
              name_lower = name.lower()
              for kw in FILTER_KEYWORDS:
                  if kw in name_lower:
                      return True
              return False

          def parse_m3u(filepath):
              channels = []
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              i = 0
              while i < len(lines):
                  line = lines[i].strip()
                  if line.startswith("#EXTINF"):
                      extinf = line
                      if i + 1 < len(lines):
                          url = lines[i + 1].strip()
                          if url.startswith("http"):
                              channels.append((extinf, url))
                          i += 2
                      else:
                          i += 1
                  else:
                      i += 1
              return channels

          def get_existing_group(extinf):
              match = re.search(r'group-title="([^"]*)"', extinf)
              return match.group(1) if match else None

          def set_group(extinf, group_name):
              # Remove any existing group-title, then force the new one
              extinf = re.sub(r'group-title="[^"]*"', '', extinf)
              extinf = re.sub(r'\s+', ' ', extinf)  # Clean up spaces
              if 'tvg-logo="' in extinf:
                  extinf = extinf.replace('tvg-logo="', f'tvg-logo="" group-title="{group_name}"', 1)
              else:
                  extinf = extinf.replace('#EXTINF:', f'#EXTINF: group-title="{group_name}"', 1)
              return extinf

          def write_m3u(output_path, channels):
              with open(output_path, 'w', encoding='utf-8') as f:
                  f.write("#EXTM3U\n")
                  for extinf, url in channels:
                      f.write(extinf + "\n")
                      f.write(url + "\n")

          if __name__ == "__main__":
              raw = parse_m3u(INPUT_FILE)
              print(f"✅ Parsed {len(raw)} raw channels")

              # 1. Remove duplicates by URL (keeps the first occurrence)
              seen = OrderedDict()
              for extinf, url in raw:
                  if url not in seen:
                      seen[url] = extinf

              # 2. Separate into three buckets
              malayalam = []
              tamil = []
              others = []

              for url, extinf in seen.items():
                  if ',' in extinf:
                      name = extinf.split(',')[-1].strip()
                  else:
                      name = "Unknown"

                  # Filter adult content (optional)
                  if is_filtered(name):
                      continue

                  group = get_existing_group(extinf)

                  if group == "Malayalam":
                      extinf = set_group(extinf, "Malayalam")
                      malayalam.append((extinf, url))
                  elif group == "Tamil":
                      extinf = set_group(extinf, "Tamil")
                      tamil.append((extinf, url))
                  else:
                      # DO NOT MODIFY these channels. Keep their original group-title exactly as-is.
                      others.append((extinf, url))

              # 3. Combine in the required order: MALAYALAM -> TAMIL -> EVERYONE ELSE
              final_channels = malayalam + tamil + others

              write_m3u(OUTPUT_FILE, final_channels)

              print(f"✅ Final playlist has {len(final_channels)} channels")
              print(f"   🟢 Malayalam: {len(malayalam)}")
              print(f"   🔴 Tamil: {len(tamil)}")
              print(f"   ⚪ Other sources (original categories kept): {len(others)}")
          EOF

          # Run the Python script
          python3 reorder.py

      - name: Preview output
        run: |
          echo "📄 First 20 lines of output.m3u:"
          head -n 20 output.m3u
          echo ""
          echo "📊 Total channels in final output:"
          grep -c "^#EXTINF" output.m3u || echo "0"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
