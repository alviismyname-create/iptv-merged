name: Merge IPTV Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-iptv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download, Filter, and Merge
        run: |
          cat > merge.py << 'EOF'
          import urllib.request
          import re
          import sys

          # ------------------------------------------------------------
          # YOUR APPROVED MALAYALAM CHANNELS
          # ------------------------------------------------------------
          APPROVED_MALAYALAM = [
              "24 News", "Amrita TV", "Anand TV", "Asianet HD",
              "Asianet Middle East", "Asianet Movies HD", "Asianet News",
              "Big TV 24x7", "DD Malayalam", "Flowers TV USA", "Harvest TV",
              "Jaihind TV", "Janam TV", "Jeevan TV", "Kairali Arabia",
              "Kairali News", "Kairali TV", "Kairali We", "Kappa TV",
              "KITE Victers (Kerala)", "Manorama News", "Mathrubhumi News",
              "Mazhavil Manorama", "Mazhavil Manorama HD", "Media One",
              "meWATCH LIVE 1", "News18 Kerala", "Reporter TV", "Safari TV",
              "Shalom", "Shalom Global", "Starnet", "UTV Palakkad"
          ]

          # ------------------------------------------------------------
          # YOUR APPROVED TAMIL CHANNELS
          # ------------------------------------------------------------
          APPROVED_TAMIL = [
              "7S Music", "Aaryaa TV", "Chithiram", "Colors Tamil HD",
              "DD Tamil HD", "Malai Murasu TV",
              "News18 Tamil Nadu", "Oli TV", "Polimer TV", "Raj Digital Plus",
              "Raj Musix Tamil", "Raj TV", "Sana Plus",
              "Subin TV", "Suriya TV", "Tamilan TV", "TamilVision-TV",
              "Thalaa TV", "Ultimate TV", "Vendhar TV", "YET TV",
              "Zee Tamil HD"
          ]

          GROUP_NAME = "Malayalam"
          USER_AGENT = "Mozilla/5.0 (compatible; IPTV-Merger/1.0)"

          # ------------------------------------------------------------
          # CHANNELS WE INJECT OURSELVES (not sourced from iptv-org).
          # These are ALWAYS present, regardless of what the upstream
          # playlist contains. Format: (name, url, logo, group)
          # ------------------------------------------------------------
          INJECTED_CHANNELS = [
              (
                  "Mazhavil Manorama HD",
                  "https://mumt07.tangotv.in/zHjX9OFlMAZHAVILMANORAMAHD/tracks-v1a1/mono.m3u8",
                  "https://i.imgur.com/xCHQrH0.png",
                  "Malayalam",
              ),
          ]

          # Names that must NOT be pulled from iptv-org (we inject our own copy).
          INJECTED_NAMES = {n.lower() for n, _, _, _ in INJECTED_CHANNELS}

          # ------------------------------------------------------------
          # Helpers
          # ------------------------------------------------------------
          def clean_name(name):
              """Strip resolution tags / [Not 24/7] style suffixes for matching."""
              name = re.sub(r'\s*\(\d{3,4}[pi]\)', '', name, flags=re.IGNORECASE)
              name = re.sub(r'\s*\[[^]]*\]', '', name)
              name = re.sub(r'\s+', ' ', name)
              return name.strip().lower()

          MALAYALAM_SET = {clean_name(n) for n in APPROVED_MALAYALAM}
          TAMIL_SET     = {clean_name(n) for n in APPROVED_TAMIL}


          def split_extinf(extinf):
              """Return (head_without_name, display_name).
                 Splits on the FIRST comma that is outside quotes — so channel
                 names containing commas (e.g. "News, Live") stay intact."""
              in_q = False
              for idx, ch in enumerate(extinf):
                  if ch == '"':
                      in_q = not in_q
                  elif ch == ',' and not in_q:
                      return extinf[:idx], extinf[idx + 1:].strip()
              return extinf, ""


          def channel_name(extinf):
              return split_extinf(extinf)[1] or "Unknown"


          def group_title(extinf):
              head, _ = split_extinf(extinf)
              m = re.search(r'group-title="([^"]*)"', head)
              return m.group(1) if m else ""


          def extinf_sort_key(extinf):
              """Sort key: (group-title, display-name), both lowercased."""
              return (group_title(extinf).lower(), channel_name(extinf).lower())


          def download_playlist(url):
              """Download and return list of (extinf, extras, url) tuples.
                 `extras` holds any #EXTVLCOPT / #KODIPROP / #EXTGRP lines that
                 sit between the #EXTINF and the URL — they are preserved so
                 players that need user-agent / referer headers still work."""
              print(f"Downloading: {url}")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                  response = urllib.request.urlopen(req, timeout=30)
                  content = response.read().decode('utf-8', errors='ignore')
                  lines = content.splitlines()
                  channels = []
                  i = 0
                  while i < len(lines):
                      line = lines[i].strip()
                      if not line.startswith("#EXTINF"):
                          i += 1
                          continue

                      extinf = line
                      extras = []
                      j = i + 1
                      while j < len(lines):
                          nxt = lines[j].strip()
                          if nxt.startswith("#") and not nxt.startswith("#EXTINF"):
                              extras.append(nxt)
                              j += 1
                          else:
                              break

                      if j < len(lines) and lines[j].strip().startswith("http"):
                          channels.append((extinf, extras, lines[j].strip()))
                          i = j + 1
                      else:
                          i = j
                  return channels
              except Exception as e:
                  print(f"❌ Error downloading {url}: {e}")
                  return []


          def set_group_and_logo(extinf, group_name, custom_logo=None):
              """Rewrite #EXTINF with a group-title and (optionally) a custom logo.
                 Produces VALID syntax: attributes appended, name preserved after the comma."""
              head, name = split_extinf(extinf)
              if not name:
                  name = "Unknown"

              head = re.sub(r'\s*group-title="[^"]*"', '', head)

              if custom_logo is not None:
                  if 'tvg-logo="' in head:
                      head = re.sub(r'tvg-logo="[^"]*"', f'tvg-logo="{custom_logo}"', head)
                  else:
                      head = f'{head} tvg-logo="{custom_logo}"'

              head = f'{head} group-title="{group_name}"'
              head = re.sub(r'[ \t]+', ' ', head).strip()
              return f'{head},{name}'


          def ensure_group(extinf, default_group):
              """Only add a group-title if none exists; otherwise leave untouched."""
              head, name = split_extinf(extinf)
              if not name:
                  name = "Unknown"
              if 'group-title="' in head:
                  return extinf
              head = f'{head} group-title="{default_group}"'
              head = re.sub(r'[ \t]+', ' ', head).strip()
              return f'{head},{name}'


          def dedupe(channels):
              """Drop exact (name, url) duplicates, keeping first occurrence."""
              seen, out = set(), []
              for extinf, extras, url in channels:
                  key = (channel_name(extinf).lower(), url)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append((extinf, extras, url))
              return out


          def head_request_ok(url):
              """Return True if a HEAD request to url succeeds (2xx/3xx)."""
              try:
                  req = urllib.request.Request(url, method="HEAD",
                                               headers={"User-Agent": USER_AGENT})
                  urllib.request.urlopen(req, timeout=10)
                  return True
              except Exception as e:
                  print(f"      ⚠️  HEAD failed: {e}")
                  return False


          # ------------------------------------------------------------
          # STEP 1: Download and FILTER Malayalam
          # ------------------------------------------------------------
          mal_channels = download_playlist("https://iptv-org.github.io/iptv/languages/mal.m3u")
          malayalam_kept = []
          mal_removed = 0
          mal_skipped_injected = 0

          for extinf, extras, url in mal_channels:
              cleaned = clean_name(channel_name(extinf))

              if cleaned in INJECTED_NAMES:
                  mal_skipped_injected += 1
                  continue

              if cleaned in MALAYALAM_SET:
                  extinf_new = set_group_and_logo(extinf, GROUP_NAME)
                  malayalam_kept.append((extinf_new, extras, url))
              else:
                  mal_removed += 1

          print(f"✅ {GROUP_NAME}: Kept {len(malayalam_kept)} channels, Removed {mal_removed} channels")
          if mal_skipped_injected:
              print(f"   ⏭️  Skipped {mal_skipped_injected} channel(s) that we inject ourselves")


          # ------------------------------------------------------------
          # STEP 1b: Inject our own Malayalam channels (always present,
          # independent of what iptv-org happens to carry).
          # ------------------------------------------------------------
          for name, url, logo, group in INJECTED_CHANNELS:
              if group != GROUP_NAME:
                  continue
              if logo:
                  print(f"   🔎 Verifying logo for '{name}': {logo}")
                  if not head_request_ok(logo):
                      print(f"   ⚠️  LOGO UNREACHABLE for '{name}' — player will show blank")
              extinf = f'#EXTINF:-1 tvg-logo="{logo or ""}" group-title="{group}",{name}'
              malayalam_kept.append((extinf, [], url))
              print(f"   ➕ Injected: {name} → {group}")

          malayalam_kept.sort(key=lambda t: extinf_sort_key(t[0]))


          # ------------------------------------------------------------
          # STEP 2: Download and FILTER Tamil
          # ------------------------------------------------------------
          tam_channels = download_playlist("https://iptv-org.github.io/iptv/languages/tam.m3u")
          tamil_kept = []
          tam_removed = 0

          for extinf, extras, url in tam_channels:
              cleaned = clean_name(channel_name(extinf))

              if cleaned in TAMIL_SET:
                  extinf_new = set_group_and_logo(extinf, "Tamil")
                  tamil_kept.append((extinf_new, extras, url))
              else:
                  tam_removed += 1

          print(f"✅ Tamil: Kept {len(tamil_kept)} channels, Removed {tam_removed} channels")


          # ------------------------------------------------------------
          # STEP 3: dom9 (force all channels into "dom9" group)
          # ------------------------------------------------------------
          dom9_channels = download_playlist(
              "https://raw.githubusercontent.com/doms9/iptv/refs/heads/default/M3U8/base.m3u8"
          )
          dom9_kept = [(set_group_and_logo(e, "dom9"), x, u) for e, x, u in dom9_channels]
          print(f"✅ dom9: Added {len(dom9_kept)} channels (all in 'dom9' group)")


          # ------------------------------------------------------------
          # STEP 4: wizakorhd main playlist (NO filtering — preserves original groups)
          # ------------------------------------------------------------
          wiz_channels = download_playlist(
              "https://raw.githubusercontent.com/wizakorhd/iptv/main/playlist.m3u"
          )
          wiz_kept = [(ensure_group(e, "Uncategorized"), x, u) for e, x, u in wiz_channels]
          print(f"✅ wizakorhd: Added {len(wiz_kept)} channels (no filtering)")


          # ------------------------------------------------------------
          # STEP 4b: Detect the live "English (Intl) - News (N)" group.
          # wizakorhd embeds a channel COUNT in the group name, and that
          # count changes as channels are added/removed. So we match by
          # pattern rather than hardcoding a number. This keeps our
          # custom news channels inside the SAME group as the rest of
          # the English international news channels — no orphan group.
          # ------------------------------------------------------------
          NEWS_GROUP_PATTERN = re.compile(r'^English \(Intl\) - News \(\d+\)$')

          news_group_counts = {}
          for extinf, _, _ in wiz_kept:
              g = group_title(extinf)
              if NEWS_GROUP_PATTERN.match(g):
                  news_group_counts[g] = news_group_counts.get(g, 0) + 1

          if news_group_counts:
              # Pick the group with the most channels, in case multiple exist.
              CUSTOM_GROUP = max(news_group_counts, key=news_group_counts.get)
              print(f"🎯 Detected news group: '{CUSTOM_GROUP}' "
                    f"({news_group_counts[CUSTOM_GROUP]} channels)")
          else:
              CUSTOM_GROUP = "English (Intl) - News"
              print(f"⚠️  Could not detect news group in wizakorhd — "
                    f"using fallback: '{CUSTOM_GROUP}'")


          # ------------------------------------------------------------
          # STEP 4c: Custom channels injected into the detected news group.
          # Format: (display name, stream URL, logo URL)
          # ------------------------------------------------------------
          CUSTOM_CHANNELS = [
              (
                  "Al Jazeera English (1080p)",
                  "https://live-hls-apps-aje-fa.getaj.net/AJE/index.m3u8",
                  "https://i.imgur.com/7bRVpnu.png",
              ),
              # Add more here, one tuple per channel
          ]

          for name, url, logo in CUSTOM_CHANNELS:
              if logo:
                  print(f"   🔎 Verifying logo for '{name}': {logo}")
                  if not head_request_ok(logo):
                      print(f"   ⚠️  LOGO UNREACHABLE for '{name}' — player will show blank")
              extinf = f'#EXTINF:-1 tvg-logo="{logo or ""}" group-title="{CUSTOM_GROUP}",{name}'
              wiz_kept.append((extinf, [], url))
              print(f"   ➕ Custom: {name} → {CUSTOM_GROUP}")


          # ------------------------------------------------------------
          # STEP 4d: Sort wizakorhd channels by (group, channel name) A→Z.
          # Applied AFTER customs are appended so Al Jazeera slots into
          # its alphabetical position inside the news group.
          # ------------------------------------------------------------
          wiz_kept.sort(key=lambda t: extinf_sort_key(t[0]))
          print(f"✅ wizakorhd: Sorted {len(wiz_kept)} channels A→Z within each group")


          # ------------------------------------------------------------
          # STEP 5: Sanity check — abort if any source looks broken.
          # ------------------------------------------------------------
          MIN_COUNTS = {
              "Malayalam": (len(malayalam_kept), 10),
              "Tamil":     (len(tamil_kept),      8),
              "dom9":      (len(dom9_kept),       30),
              "wizakorhd": (len(wiz_kept),        100),
          }

          aborted = False
          for label, (count, minimum) in MIN_COUNTS.items():
              if count < minimum:
                  print(f"❌ {label}: only {count} channels (expected ≥ {minimum}) — source likely down")
                  aborted = True

          if aborted:
              sys.exit("❌ Aborting: source(s) returned too few channels. Not publishing.")


          # ------------------------------------------------------------
          # STEP 6: Merge, dedupe, write output.m3u
          # ------------------------------------------------------------
          all_final = malayalam_kept + tamil_kept + dom9_kept + wiz_kept
          before    = len(all_final)
          all_final = dedupe(all_final)
          dupes     = before - len(all_final)

          with open("output.m3u", "w", encoding="utf-8") as f:
              f.write('#EXTM3U x-tvg-url="https://iptv-org.github.io/epg/index.xml"\n')
              for extinf, extras, url in all_final:
                  f.write(extinf + "\n")
                  for x in extras:
                      f.write(x + "\n")
                  f.write(url + "\n")

          print(f"\n✅ FINAL: {len(all_final)} total channels in output.m3u (removed {dupes} duplicates)")
          print(f"   🟢 {GROUP_NAME} (filtered + injected): {len(malayalam_kept)}")
          print(f"   🔴 Tamil (filtered):                 {len(tamil_kept)}")
          print(f"   🟠 dom9 (all channels):              {len(dom9_kept)}")
          print(f"   🟣 wizakorhd (no filtering):         {len(wiz_kept)}")
          print(f"   📰 News group (detected):            '{CUSTOM_GROUP}'")
          EOF

          python3 merge.py

      - name: Check Missing Logos
        run: |
          echo "🔍 Checking for channels without logos..."
          echo ""

          TOTAL=$(grep -c '^#EXTINF' output.m3u 2>/dev/null || echo 0)
          MISSING=$(grep '^#EXTINF' output.m3u 2>/dev/null | grep -vc 'tvg-logo="http' || echo 0)

          echo "📊 Total channels: $TOTAL"
          echo "❌ Channels without a usable logo URL: $MISSING"
          echo ""

          if [ "$MISSING" -gt 0 ]; then
            echo "📋 Channels missing logos (first 20):"
            echo "----------------------------------------"
            grep '^#EXTINF' output.m3u | grep -v 'tvg-logo="http' | head -20 | sed 's/.*,//'
            echo ""

            if [ "$MISSING" -gt 20 ]; then
              echo "... and $((MISSING - 20)) more channels missing logos"
            fi
          else
            echo "🎉 All channels have logos!"
          fi

      - name: Stage output
        run: |
          mkdir -p dist
          mv output.m3u dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
